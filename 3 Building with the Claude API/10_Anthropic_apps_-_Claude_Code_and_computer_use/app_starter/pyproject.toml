[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[docx,pdf]>=0.1.1",
    "mcp[cli]==1.8.0",
    "pydantic>=2.11.3",
    "pytest>=8.3.5",
    "ruff>=0.9.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
